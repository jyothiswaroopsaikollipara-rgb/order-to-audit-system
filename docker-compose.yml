
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_audit
      POSTGRES_USER: order_audit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_audit -d order_audit"]
      interval: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

  api:
    build: .
    environment:
      DATABASE_URL: postgres://order_audit:${POSTGRES_PASSWORD:-local_dev_only_change_me}@db:5432/order_audit
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PORT: 3000
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      SUPPLIER_NAME: ${SUPPLIER_NAME:-South Indian Snacks}
      SUPPLIER_ADDRESS: ${SUPPLIER_ADDRESS:-Tamil Nadu, India}
      SUPPLIER_GSTIN: ${SUPPLIER_GSTIN:-DEMO - Not registered}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node src/seed.js && node src/migrate.js && node src/server.js"

volumes:
  pgdata:
